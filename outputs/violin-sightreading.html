<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小提琴视奏 - 五线谱对应练习</title>
  <style>
    :root {
      --bg: #f4f7ff;
      --card: #ffffff;
      --line: #4f5f8f;
      --text: #1f2a44;
      --muted: #617198;
      --ok: #138a63;
      --bad: #d64545;
      --accent: #5d79df;
      --btn: #eef3ff;
      --btn-hover: #dfe8ff;
      --border: #d7e0f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 0%, #ffffff 0%, var(--bg) 45%, #edf2ff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .app {
      width: min(980px, 100%);
      background: linear-gradient(180deg, #ffffff 0%, #f7faff 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 14px 40px rgba(67, 90, 160, .15);
      overflow: hidden;
    }
    .head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      justify-content: space-between;
    }
    .title {
      margin: 0;
      font-size: 20px;
      letter-spacing: .3px;
    }
    .stats {
      display: flex;
      gap: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .main {
      padding: 18px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 14px;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #ffffff;
      padding: 14px;
    }
    .panel h2 {
      margin: 0;
      font-size: 15px;
      color: var(--muted);
      font-weight: 600;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .panel-head select {
      border: 1px solid #b7c8f1;
      background:
        linear-gradient(180deg, #ffffff 0%, #f3f7ff 100%);
      color: var(--text);
      border-radius: 12px;
      padding: 8px 34px 8px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      min-width: 112px;
      box-shadow: 0 2px 10px rgba(88, 118, 196, .12);
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #5e78bf 50%),
        linear-gradient(135deg, #5e78bf 50%, transparent 50%),
        linear-gradient(180deg, #ffffff 0%, #f3f7ff 100%);
      background-position:
        calc(100% - 16px) calc(50% + 1px),
        calc(100% - 10px) calc(50% + 1px),
        0 0;
      background-size: 6px 6px, 6px 6px, 100% 100%;
      background-repeat: no-repeat;
      transition: border-color .15s ease, box-shadow .15s ease, transform .08s ease;
    }
    .panel-head select:hover {
      border-color: #96afea;
      box-shadow: 0 4px 14px rgba(88, 118, 196, .16);
    }
    .panel-head select:focus {
      outline: none;
      border-color: #6f8fdf;
      box-shadow: 0 0 0 3px rgba(111, 143, 223, .22), 0 4px 14px rgba(88, 118, 196, .16);
    }
    .panel-head select:active {
      transform: translateY(1px);
    }
    .staff-wrap {
      overflow: auto;
      min-height: 470px;
      display: flex;
      align-items: center;
    }
    svg { width: 100%; height: auto; display: block; }
    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      height: 34px;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      width: 100%;
    }
    .fretboard {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: linear-gradient(180deg, #f8fbff 0%, #f1f6ff 100%);
    }
    .board-head {
      display: grid;
      grid-template-columns: 54px repeat(4, 1fr);
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      color: #617198;
      font-size: 12px;
      letter-spacing: .3px;
    }
    .board-head span {
      text-align: center;
      font-weight: 600;
    }
    .board {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 10px;
      align-items: start;
    }
    .left-positions {
      display: grid;
      grid-template-rows: 62px repeat(5, 62px);
      gap: 12px;
      margin-top: 14px;
    }
    .pos-label {
      color: #5e6f97;
      font-size: 12px;
      display: grid;
      place-items: center;
      border: 1px dashed #bfd0f7;
      border-radius: 8px;
      background: rgba(102, 132, 214, .07);
    }
    .pos-spacer {
      border: none;
      background: transparent;
    }
    .string-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 14px 10px 12px;
      background: linear-gradient(180deg, #ffffff 0%, #f4f8ff 100%);
      border: 1px solid #cfdbf7;
      border-radius: 12px;
      overflow: hidden;
    }
    .string-grid::before {
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, #a9baf033, #8ea5ff77, #a9baf033);
    }
    .string-grid::after {
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, #a9baf033, #8ea5ff77, #a9baf033);
    }
    .string-col {
      display: grid;
      grid-template-rows: 62px repeat(5, 62px);
      gap: 12px;
      position: relative;
    }
    .string-col::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 86px;
      bottom: 10px;
      width: 2px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #9aaedc, #6f86be);
      box-shadow: 0 0 0 1px #ffffff66;
      pointer-events: none;
      z-index: 1;
    }
    .string-col::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 66px;
      height: 24px;
      width: 2px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #f2f6ff, #d8e2ff);
      box-shadow: 0 0 0 1px #ffffff2a;
      pointer-events: none;
      z-index: 3;
    }
    .stop {
      position: relative;
      height: 62px;
      display: grid;
      place-items: center;
      z-index: 2;
    }
    .stop.slot-2l {
      transform: translateY(-14px);
    }
    .stop.slot-2h {
      transform: translateY(14px);
    }
    .left-positions .pos-label:nth-child(3) {
      transform: translateY(-14px);
    }
    .left-positions .pos-label:nth-child(4) {
      transform: translateY(14px);
    }
    .dot {
      position: relative;
      width: 22px;
      height: 22px;
      border: 1px solid #6a7ec9;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 25%, #ffffff 0%, #c8d8ff 62%, #91aaf2 100%);
      cursor: pointer;
      transition: .14s ease;
      color: #2c3f72;
      font-size: 0;
      user-select: none;
      box-shadow: inset 0 1px 1px #fff8, 0 2px 6px rgba(72, 100, 174, .25);
      z-index: 2;
    }
    .dot::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      left: -12px;
      right: -12px;
      width: auto;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, #ffffff00 0%, #ffffff55 50%, #ffffff00 100%);
      pointer-events: none;
    }
    .dot::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: #eef3ff;
      opacity: .85;
      pointer-events: none;
    }
    .dot:hover {
      transform: scale(1.18);
      filter: saturate(1.08) brightness(1.03);
      box-shadow: inset 0 1px 1px #fff8, 0 6px 14px rgba(72, 100, 174, .35);
    }
    .dot.disabled {
      background: radial-gradient(circle at 30% 25%, #f3f6ff 0%, #dfe7fb 62%, #cbd8f5 100%);
      border-color: #b9c8ee;
      box-shadow: inset 0 1px 1px #fff8;
      opacity: .42;
      cursor: not-allowed;
      filter: grayscale(.2);
    }
    .dot.disabled:hover {
      transform: none;
      filter: grayscale(.2);
      box-shadow: inset 0 1px 1px #fff8;
    }
    .dot.expected {
      box-shadow: 0 0 0 3px #ffd166, inset 0 1px 1px #fff8, 0 6px 14px rgba(0, 0, 0, .35);
      filter: saturate(1.2) brightness(1.08);
    }
    .fretboard.celebrate {
      animation: celebrateFlash .58s ease;
    }
    @keyframes celebrateFlash {
      0% { box-shadow: 0 0 0 0 rgba(56, 211, 159, .0), inset 0 0 0 0 rgba(56, 211, 159, .0); }
      35% { box-shadow: 0 0 0 3px rgba(56, 211, 159, .38), inset 0 0 0 2px rgba(56, 211, 159, .28); }
      100% { box-shadow: 0 0 0 0 rgba(56, 211, 159, .0), inset 0 0 0 0 rgba(56, 211, 159, .0); }
    }
    .foot {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status-ok { color: var(--ok); }
    .status-bad { color: var(--bad); }
    .ctrls { display: flex; gap: 8px; align-items: center; }
    .ctrls select {
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .ctrls button {
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .ctrls button:hover {
      background: var(--btn-hover);
    }
    @media (max-width: 860px) {
      .main { grid-template-columns: 1fr; }
      .staff-wrap {
        min-height: 0;
        display: block;
      }
      .panel-head {
        align-items: flex-start;
      }
      .panel-head select {
        min-width: 102px;
        font-size: 12px;
      }
      .left-positions {
        grid-template-rows: 58px repeat(5, 58px);
        gap: 10px;
        margin-top: 12px;
      }
      .string-grid { gap: 10px; }
      .string-col {
        grid-template-rows: 58px repeat(5, 58px);
        gap: 10px;
      }
      .string-col::after {
        top: 78px;
      }
      .string-col::before {
        top: 60px;
        height: 20px;
      }
      .stop { height: 58px; }
      .stop.slot-2l { transform: translateY(-11px); }
      .stop.slot-2h { transform: translateY(11px); }
      .left-positions .pos-label:nth-child(3) { transform: translateY(-11px); }
      .left-positions .pos-label:nth-child(4) { transform: translateY(11px); }
      .dot { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="head">
      <h1 class="title">🎻 小提琴视奏对应五线谱</h1>
      <div class="stats">
        <span>题号：<b id="qNum">1</b></span>
        <span>正确：<b id="okNum">0</b></span>
        <span>连对：<b id="streakNum">0</b></span>
      </div>
    </div>

    <div class="main">
      <section class="panel">
        <div class="panel-head">
          <h2 id="questionTitle">当前五线谱音符（高音谱号）</h2>
          <div style="display:flex; gap:8px; align-items:center;">
            <select id="modeSelect" title="选择出题模式">
              <option value="staff">五线谱</option>
              <option value="solfege">唱名</option>
            </select>
            <select id="scaleSelect" title="选择练习调性">
              <option value="all">全部</option>
              <option value="g_major">G大调</option>
              <option value="a_major">A大调</option>
            </select>
          </div>
        </div>
        <div class="staff-wrap">
          <svg id="staff" viewBox="0 0 740 280" aria-label="五线谱"></svg>
        </div>
        <div class="hint" id="statusText"></div>
      </section>

      <section class="panel">
        <h2>小提琴第一把位指板（点击弦位作答）</h2>
        <div class="fretboard" id="rows"></div>
      </section>
    </div>

    <div class="foot">
      <div>参考 typepiano 的即时反馈思路，做成更接近真实琴颈的视觉练习。</div>
      <div class="ctrls">
        <button id="nextBtn">换一题</button>
        <button id="toggleNameBtn">显示/隐藏答案名</button>
      </div>
    </div>
  </div>

  <script>
    const NOTES = [
      { id: 'G3', label: 'G3', zh: 'G弦 空弦', string: 'G弦', finger: '0', midi: 55, step: -5 },
      { id: 'A3', label: 'A3', zh: 'G弦 1指', string: 'G弦', finger: '1', midi: 57, step: -4 },
      { id: 'Bb3', label: 'B♭3', zh: 'G弦 2指低位（贴1指）', string: 'G弦', finger: '2低', midi: 58, step: -3, accidental: 'b', slot: '2l' },
      { id: 'B3', label: 'B3', zh: 'G弦 2指高位（贴3指）', string: 'G弦', finger: '2高', midi: 59, step: -3, slot: '2h' },
      { id: 'C4', label: 'C4', zh: 'G弦 3指', string: 'G弦', finger: '3', midi: 60, step: -2 },
      { id: 'D4_G4', label: 'D4', zh: 'G弦 4指', string: 'G弦', finger: '4', midi: 62, step: -1, slot: '4' },

      { id: 'D4', label: 'D4', zh: 'D弦 空弦', string: 'D弦', finger: '0', midi: 62, step: -1 },
      { id: 'E4', label: 'E4', zh: 'D弦 1指', string: 'D弦', finger: '1', midi: 64, step: 0 },
      { id: 'F4', label: 'F4', zh: 'D弦 2指低位（贴1指）', string: 'D弦', finger: '2低', midi: 65, step: 1, slot: '2l' },
      { id: 'F#4', label: 'F♯4', zh: 'D弦 2指高位（贴3指）', string: 'D弦', finger: '2高', midi: 66, step: 1, accidental: '#', slot: '2h' },
      { id: 'G4', label: 'G4', zh: 'D弦 3指', string: 'D弦', finger: '3', midi: 67, step: 2 },
      { id: 'A4_D4', label: 'A4', zh: 'D弦 4指', string: 'D弦', finger: '4', midi: 69, step: 3, slot: '4' },

      { id: 'A4', label: 'A4', zh: 'A弦 空弦', string: 'A弦', finger: '0', midi: 69, step: 3 },
      { id: 'B4', label: 'B4', zh: 'A弦 1指', string: 'A弦', finger: '1', midi: 71, step: 4 },
      { id: 'C5', label: 'C5', zh: 'A弦 2指低位（贴1指）', string: 'A弦', finger: '2低', midi: 72, step: 5, slot: '2l' },
      { id: 'C#5', label: 'C♯5', zh: 'A弦 2指高位（贴3指）', string: 'A弦', finger: '2高', midi: 73, step: 5, accidental: '#', slot: '2h' },
      { id: 'D5', label: 'D5', zh: 'A弦 3指', string: 'A弦', finger: '3', midi: 74, step: 6 },
      { id: 'E5_A4', label: 'E5', zh: 'A弦 4指', string: 'A弦', finger: '4', midi: 76, step: 7, slot: '4' },

      { id: 'E5', label: 'E5', zh: 'E弦 空弦', string: 'E弦', finger: '0', midi: 76, step: 7 },
      { id: 'F#5', label: 'F♯5', zh: 'E弦 1指', string: 'E弦', finger: '1', midi: 78, step: 8, accidental: '#' },
      { id: 'G5', label: 'G5', zh: 'E弦 2指低位（贴1指）', string: 'E弦', finger: '2低', midi: 79, step: 9, slot: '2l' },
      { id: 'G#5', label: 'G♯5', zh: 'E弦 2指高位（贴3指）', string: 'E弦', finger: '2高', midi: 80, step: 9, accidental: '#', slot: '2h' },
      { id: 'A5', label: 'A5', zh: 'E弦 3指', string: 'E弦', finger: '3', midi: 81, step: 10 },
      { id: 'B5_E4', label: 'B5', zh: 'E弦 4指', string: 'E弦', finger: '4', midi: 83, step: 11, slot: '4' }
    ].map(n => ({ ...n, slot: n.slot || n.finger.replace('指', '') }));

    const POSITION_ORDER = ['0', '1', '2l', '2h', '3', '4'];

    const strings = ['G弦', 'D弦', 'A弦', 'E弦'];
    const rowsEl = document.getElementById('rows');
    const statusText = document.getElementById('statusText');
    const staff = document.getElementById('staff');
    const qNumEl = document.getElementById('qNum');
    const okNumEl = document.getElementById('okNum');
    const streakNumEl = document.getElementById('streakNum');
    const nextBtn = document.getElementById('nextBtn');
    const toggleNameBtn = document.getElementById('toggleNameBtn');
    const scaleSelect = document.getElementById('scaleSelect');
    const modeSelect = document.getElementById('modeSelect');
    const questionTitle = document.getElementById('questionTitle');
    const fretboardEl = document.getElementById('rows');

    const SCALE_PC = {
      all: null,
      g_major: new Set([7, 9, 11, 0, 2, 4, 6]),
      a_major: new Set([9, 11, 1, 2, 4, 6, 8])
    };
    const KEY_SIGNATURE_SHARPS = {
      all: [],
      g_major: ['F'],
      a_major: ['F', 'C', 'G']
    };
    const SHARP_STEPS = { F: 8, C: 5, G: 9, D: 6, A: 3, E: 7, B: 4 };

    let showName = false;
    let questionCount = 1;
    let correctCount = 0;
    let streak = 0;
    let currentScale = 'all';
    let currentMode = 'staff';
    let current = pickRandom();

    const PRAISE_TEXT = ['太棒了！', '很好！', '答得漂亮！', '稳！', '继续保持！'];

    const NATURAL_SOLFEGE = {
      0: 'Do',
      2: 'Re',
      4: 'Mi',
      5: 'Fa',
      7: 'Sol',
      9: 'La',
      11: 'Xi'
    };

    function getActiveNotes() {
      const allowed = SCALE_PC[currentScale];
      if (!allowed) return NOTES;
      return NOTES.filter(note => allowed.has(note.midi % 12));
    }

    function pickRandom() {
      const active = getActiveNotes();
      return active[Math.floor(Math.random() * active.length)];
    }

    function renderButtons() {
      rowsEl.innerHTML = '';
      const allowed = SCALE_PC[currentScale];

      const head = document.createElement('div');
      head.className = 'board-head';
      head.innerHTML = '<span></span><span>G弦</span><span>D弦</span><span>A弦</span><span>E弦</span>';
      rowsEl.appendChild(head);

      const board = document.createElement('div');
      board.className = 'board';

      const leftPos = document.createElement('div');
      leftPos.className = 'left-positions';
      leftPos.innerHTML = `
        <div class="pos-label">空弦</div>
        <div class="pos-label">1指</div>
        <div class="pos-label">2指低</div>
        <div class="pos-label">2指高</div>
        <div class="pos-label">3指</div>
        <div class="pos-label">4指</div>
      `;

      const stringGrid = document.createElement('div');
      stringGrid.className = 'string-grid';

      for (const s of strings) {
        const col = document.createElement('div');
        col.className = 'string-col';

        const openNote = NOTES.find(n => n.string === s && n.slot === '0');
        const openStop = document.createElement('div');
        openStop.className = 'stop';
        const openDot = document.createElement('div');
        openDot.className = 'dot';
        openDot.dataset.id = openNote.id;
        openDot.dataset.midi = String(openNote.midi);
        openDot.title = `${openNote.zh} (${openNote.label})`;
        const openEnabled = !allowed || allowed.has(openNote.midi % 12);
        if (openEnabled) {
          openDot.onclick = () => choose(openNote);
        } else {
          openDot.classList.add('disabled');
        }
        openStop.appendChild(openDot);
        col.appendChild(openStop);

        const notesInString = NOTES.filter(n => n.string === s)
          .filter(n => n.slot !== '0')
          .sort((a, b) => POSITION_ORDER.indexOf(a.slot) - POSITION_ORDER.indexOf(b.slot));
        for (const n of notesInString) {
          const stop = document.createElement('div');
          stop.className = 'stop';

          const b = document.createElement('div');
          b.className = 'dot';
          b.dataset.id = n.id;
          b.dataset.midi = String(n.midi);
          b.title = `${n.zh} (${n.label})`;
          const enabled = !allowed || allowed.has(n.midi % 12);
          if (enabled) {
            b.onclick = () => choose(n);
          } else {
            b.classList.add('disabled');
          }
          stop.appendChild(b);

          stop.classList.add(`slot-${n.slot}`);

          col.appendChild(stop);
        }

        stringGrid.appendChild(col);
      }

      board.appendChild(leftPos);
      board.appendChild(stringGrid);
      rowsEl.appendChild(board);
    }

    function drawStaff(note) {
      const NS = 'http://www.w3.org/2000/svg';
      staff.innerHTML = '';

      const left = 110;
      const right = 680;
      const staffTop = 100;
      const gap = 20;
      const staffBottom = staffTop + gap * 4;

      for (let i = 0; i < 5; i++) {
        const y = staffTop + i * gap;
        const line = document.createElementNS(NS, 'line');
        line.setAttribute('x1', left);
        line.setAttribute('x2', right);
        line.setAttribute('y1', y);
        line.setAttribute('y2', y);
        line.setAttribute('stroke', '#b7c6ee');
        line.setAttribute('stroke-width', '2');
        staff.appendChild(line);
      }

      const clef = document.createElementNS(NS, 'text');
      clef.setAttribute('x', 50);
      clef.setAttribute('y', 160);
      clef.setAttribute('font-size', '92');
      clef.setAttribute('fill', '#8ea3d9');
      clef.textContent = '𝄞';
      staff.appendChild(clef);

      drawKeySignature(currentScale, left + 30, staffBottom, NS);

      const noteX = 380;
      const y = staffBottom - (note.step * 10);

      const noteHead = document.createElementNS(NS, 'ellipse');
      noteHead.setAttribute('cx', noteX);
      noteHead.setAttribute('cy', y);
      noteHead.setAttribute('rx', '13');
      noteHead.setAttribute('ry', '9');
      noteHead.setAttribute('fill', '#7ea1ff');
      noteHead.setAttribute('transform', `rotate(-20 ${noteX} ${y})`);
      staff.appendChild(noteHead);

      const stem = document.createElementNS(NS, 'line');
      stem.setAttribute('x1', noteX + 12);
      stem.setAttribute('x2', noteX + 12);
      stem.setAttribute('y1', y);
      stem.setAttribute('y2', y - 56);
      stem.setAttribute('stroke', '#9eb2e6');
      stem.setAttribute('stroke-width', '2');
      staff.appendChild(stem);

      if (shouldShowAccidental(note)) {
        const fontSize = note.accidental === '#' ? 48 : 38;
        const acc = document.createElementNS(NS, 'text');
        acc.setAttribute('x', noteX - 40);
        acc.setAttribute('y', toAccidentalBaseline(y, fontSize, note.accidental));
        acc.setAttribute('font-size', String(fontSize));
        acc.setAttribute('fill', '#8ea3d9');
        acc.textContent = note.accidental === '#' ? '♯' : '♭';
        staff.appendChild(acc);
      }

      drawLedgerLines(note.step, noteX, staffBottom, NS);

    }

    function drawSolfege(note) {
      const NS = 'http://www.w3.org/2000/svg';
      staff.innerHTML = '';

      const tip = document.createElementNS(NS, 'text');
      tip.setAttribute('x', 370);
      tip.setAttribute('y', 96);
      tip.setAttribute('text-anchor', 'middle');
      tip.setAttribute('font-size', '34');
      tip.setAttribute('font-weight', '600');
      tip.setAttribute('fill', '#6f84bf');
      tip.textContent = '当前唱名';
      staff.appendChild(tip);

      const whiteArea = document.createElementNS(NS, 'rect');
      whiteArea.setAttribute('x', 70);
      whiteArea.setAttribute('y', 104);
      whiteArea.setAttribute('width', 600);
      whiteArea.setAttribute('height', 110);
      whiteArea.setAttribute('rx', 0);
      whiteArea.setAttribute('fill', '#ffffff');
      staff.appendChild(whiteArea);

      const name = document.createElementNS(NS, 'text');
      name.setAttribute('x', 370);
      name.setAttribute('y', 188);
      name.setAttribute('text-anchor', 'middle');
      name.setAttribute('font-size', '92');
      name.setAttribute('font-weight', '700');
      name.setAttribute('fill', '#4f6fe0');
      name.textContent = `${getSolfege(note)} (${getLetterName(note)})`;
      staff.appendChild(name);

    }

    function getSolfege(note) {
      const baseByLetter = {
        C: 'Do',
        D: 'Re',
        E: 'Mi',
        F: 'Fa',
        G: 'Sol',
        A: 'La',
        B: 'Xi'
      };

      const m = String(note.label).match(/^([A-G])([#♯b♭]?)/);
      if (!m) return '?';
      const letter = m[1];
      const accidental = m[2];
      const base = baseByLetter[letter] || '?';

      if (accidental === '#' || accidental === '♯') return `${base}♯`;
      if (accidental === 'b' || accidental === '♭') return `${base}♭`;
      return base;
    }

    function getLetterName(note) {
      const m = String(note.label).match(/^([A-G])([#♯b♭]?)/);
      if (!m) return '?';
      const letter = m[1];
      const accidental = m[2];
      if (accidental === '#' || accidental === '♯') return `${letter}♯`;
      if (accidental === 'b' || accidental === '♭') return `${letter}♭`;
      return letter;
    }

    function renderQuestion() {
      questionTitle.textContent = currentMode === 'staff'
        ? '当前五线谱音符（高音谱号）'
        : '当前唱名（Do/Re/Mi...）';
      staff.setAttribute('viewBox', '0 0 740 280');
      if (currentMode === 'staff') {
        drawStaff(current);
      } else {
        drawSolfege(current);
      }
    }

    function drawKeySignature(scale, startX, staffBottom, NS) {
      const sharps = KEY_SIGNATURE_SHARPS[scale] || [];
      sharps.forEach((letter, index) => {
        const step = SHARP_STEPS[letter];
        const y = staffBottom - (step * 10);
        const fontSize = 42;
        const acc = document.createElementNS(NS, 'text');
        acc.setAttribute('x', startX + index * 22);
        acc.setAttribute('y', toAccidentalBaseline(y, fontSize, '#'));
        acc.setAttribute('font-size', String(fontSize));
        acc.setAttribute('fill', '#8ea3d9');
        acc.textContent = '♯';
        staff.appendChild(acc);
      });
    }

    function toAccidentalBaseline(centerY, fontSize, accidental) {
      const factor = accidental === '#' ? 0.39 : 0.34;
      return centerY + fontSize * factor;
    }

    function shouldShowAccidental(note) {
      if (!note.accidental) return false;
      if (note.accidental === 'b') return true;
      const keySharps = KEY_SIGNATURE_SHARPS[currentScale] || [];
      const noteLetter = note.label[0];
      if (note.accidental === '#' && keySharps.includes(noteLetter)) return false;
      return true;
    }

    function drawLedgerLines(step, x, staffBottom, NS) {
      const yFromStep = (s) => staffBottom - (s * 10);

      if (step <= -2) {
        for (let ledgerStep = -2; ledgerStep >= step; ledgerStep -= 2) {
          const ly = yFromStep(ledgerStep);
          const line = document.createElementNS(NS, 'line');
          line.setAttribute('x1', x - 24);
          line.setAttribute('x2', x + 24);
          line.setAttribute('y1', ly);
          line.setAttribute('y2', ly);
          line.setAttribute('stroke', '#9eb2e6');
          line.setAttribute('stroke-width', '2');
          staff.appendChild(line);
        }
      }

      if (step >= 10) {
        for (let ledgerStep = 10; ledgerStep <= step; ledgerStep += 2) {
          const ly = yFromStep(ledgerStep);
          const line = document.createElementNS(NS, 'line');
          line.setAttribute('x1', x - 24);
          line.setAttribute('x2', x + 24);
          line.setAttribute('y1', ly);
          line.setAttribute('y2', ly);
          line.setAttribute('stroke', '#9eb2e6');
          line.setAttribute('stroke-width', '2');
          staff.appendChild(line);
        }
      }
    }

    function choose(selected) {
      const isRight = isCorrectSelection(selected, current);
      if (isRight) {
        correctCount += 1;
        streak += 1;
        const praise = PRAISE_TEXT[Math.floor(Math.random() * PRAISE_TEXT.length)];
        statusText.innerHTML = `<span class="status-ok">✅ ${praise} ${selected.label} = ${selected.zh}</span>`;
        playSuccessFeedback();
        setTimeout(nextQuestion, 620);
      } else {
        streak = 0;
        statusText.innerHTML = `<span class="status-bad">❌ 不对。你选的是 ${selected.label}（${selected.zh}）；正确是 ${current.label}（${current.zh}）。</span>`;
        highlightExpected();
      }
      refreshStats();
    }

    function playSuccessFeedback() {
      fretboardEl.classList.remove('celebrate');
      void fretboardEl.offsetWidth;
      fretboardEl.classList.add('celebrate');
      setTimeout(() => fretboardEl.classList.remove('celebrate'), 620);
    }

    function highlightExpected() {
      const targets = Array.from(rowsEl.querySelectorAll('.dot')).filter((dot) => {
        const midi = Number(dot.dataset.midi);
        return isCorrectSelection({ midi }, current);
      });
      if (!targets.length) return;
      targets.forEach(t => t.classList.add('expected'));
      setTimeout(() => targets.forEach(t => t.classList.remove('expected')), 700);
    }

    function isCorrectSelection(selected, target) {
      if (currentMode === 'solfege') {
        return (selected.midi % 12) === (target.midi % 12);
      }
      return selected.midi === target.midi;
    }

    function nextQuestion() {
      questionCount += 1;
      current = pickRandom();
      renderQuestion();
      refreshStats();
      if (!statusText.textContent.includes('不对')) statusText.textContent = '';
    }

    function refreshStats() {
      qNumEl.textContent = String(questionCount);
      okNumEl.textContent = String(correctCount);
      streakNumEl.textContent = String(streak);
    }

    toggleNameBtn.onclick = () => {
      showName = !showName;
      renderButtons();
      renderQuestion();
    };

    nextBtn.onclick = () => {
      streak = 0;
      nextQuestion();
    };

    scaleSelect.onchange = () => {
      currentScale = scaleSelect.value;
      questionCount = 1;
      correctCount = 0;
      streak = 0;
      current = pickRandom();
      renderButtons();
      renderQuestion();
      refreshStats();
      statusText.textContent = '';
    };

    modeSelect.onchange = () => {
      currentMode = modeSelect.value;
      renderQuestion();
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'n' || e.key === 'N' || e.key === ' ') {
        e.preventDefault();
        nextBtn.click();
      }
    });

    renderButtons();
    renderQuestion();
    refreshStats();
  </script>
</body>
</html>
